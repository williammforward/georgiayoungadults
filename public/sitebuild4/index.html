<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#2F4A5A">
<title>Map · WITH</title>
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://use.typekit.net" crossorigin>
<link rel="stylesheet" href="https://use.typekit.net/riq0xse.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@600;900&display=swap">
<link rel="stylesheet" href="/assets/css/site.css">
<script src="/assets/js/site.js" defer></script>
<script src="/assets/js/map.js" defer></script>
</head>
<body data-page="map">

<div class="bg bg--sky" aria-hidden="true">
  <picture>
    <source type="image/webp" srcset="/assets/hero-vertical.webp">
    <img class="bg__sky" src="/assets/hero-vertical.jpg" alt="">
  </picture>
  <div class="bg__shade"></div>
  <div class="bg__halftone"></div>
  <div class="bg__grain"></div>
</div>

<main class="page">
  <header class="page-head">
    <h1 class="t-page">Map</h1>
    <div class="page-head__pills" id="head-pills"></div>
  </header>

  <section class="map" aria-label="Venue map">
    <div class="map__view" id="map-view">
      <div class="map__canvas" id="map-canvas"></div>
      <div class="map__zoom">
        <button class="map__btn" id="zoom-in" type="button" aria-label="Zoom in">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        </button>
        <button class="map__btn" id="zoom-out" type="button" aria-label="Zoom out" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"/></svg>
        </button>
      </div>
    </div>
    <div class="legend" aria-label="Map legend">
      <span class="pill"><span class="legend__mark"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2.6l2.9 6 6.5.9-4.7 4.6 1.1 6.5L12 17.5l-5.8 3.1 1.1-6.5L2.6 9.5l6.5-.9z"/></svg></span>Entrance</span>
      <span class="pill"><span class="legend__mark">R</span>Restrooms</span>
      <span class="pill"><span class="legend__mark">E</span>Elevator</span>
    </div>
  </section>

  <div class="chips" id="chips" role="group" aria-label="Rooms"></div>
  <div id="room-card"></div>
</main>

</body>
</html>
