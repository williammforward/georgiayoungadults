<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#2F4A5A">
<title>WITH · Georgia Young Adult Conference</title>
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://use.typekit.net" crossorigin>
<link rel="stylesheet" href="https://use.typekit.net/riq0xse.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@600;900&display=swap">
<link rel="stylesheet" href="/assets/css/site.css">
<link rel="preload" as="image" type="image/webp" href="/assets/hero-vertical.webp" media="not all and (min-aspect-ratio: 4/3)" fetchpriority="high">
<link rel="preload" as="image" type="image/webp" href="/assets/hero-wide.webp" media="(min-aspect-ratio: 4/3)" fetchpriority="high">
<script src="/assets/js/site.js" defer></script>
<script src="/assets/js/home.js" defer></script>
</head>
<body data-page="home">

<div class="bg bg--poster" aria-hidden="true">
  <div class="bg__drift">
    <picture>
      <source media="(min-aspect-ratio: 4/3)" type="image/webp" srcset="/assets/hero-wide.webp">
      <source media="(min-aspect-ratio: 4/3)" srcset="/assets/hero-wide.jpg">
      <source type="image/webp" srcset="/assets/hero-vertical.webp">
      <img class="bg__fill" src="/assets/hero-vertical.jpg" alt="">
    </picture>
    <picture>
      <source media="(min-aspect-ratio: 4/3)" type="image/webp" srcset="/assets/hero-wide.webp">
      <source media="(min-aspect-ratio: 4/3)" srcset="/assets/hero-wide.jpg">
      <source type="image/webp" srcset="/assets/hero-vertical.webp">
      <img class="bg__art" src="/assets/hero-vertical.jpg" alt="">
    </picture>
  </div>
  <div class="bg__shade"></div>
  <div class="bg__halftone"></div>
  <div class="bg__grain"></div>
</div>

<main class="page">
  <header class="hero">
    <h1 class="sr-only">WITH: Georgia Young Adult Conference</h1>
  </header>
  <div class="deck" id="deck"></div>
</main>

</body>
</html>
