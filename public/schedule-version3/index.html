<!-- Critical CSS: the splash paints from this alone; the page waits for its own stylesheet. -->
<style>
html{background:#2F4A5A}
body{margin:0}
/* The page shows once its own stylesheet has loaded. */
html:not(.is-ready) body>:not(.splash){visibility:hidden}
/* ---- Splash (first page opened in a tab) ---- */
.splash{display:none}
html.splash-on{background:#000}
html.splash-on body>:not(.splash){opacity:0}
html.splash-out body>:not(.splash){opacity:1;transition:opacity calc(var(--sp-out,1200ms)*.55) cubic-bezier(.22,.61,.36,1)}
html.splash-on .splash{position:fixed;top:0;right:0;bottom:0;left:0;z-index:1000;display:block;overflow:hidden;background:#000;cursor:pointer;touch-action:none;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
/* Sized to the full width (a few pixels of overhang at most) so the baked-in text is never cropped;
   on taller screens the top and bottom edges feather into the black. */
.splash__media{position:absolute;left:50%;top:50%;width:min(56.25vh,106vw);width:min(56.25dvh,106vw);aspect-ratio:9/16;transform:translate(-50%,-50%);object-fit:cover;-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 9%,#000 91%,transparent 100%),linear-gradient(to right,transparent 0,#000 2.5%,#000 97.5%,transparent 100%);-webkit-mask-composite:source-in;mask-image:linear-gradient(to bottom,transparent 0,#000 9%,#000 91%,transparent 100%),linear-gradient(to right,transparent 0,#000 2.5%,#000 97.5%,transparent 100%);mask-composite:intersect}
.splash__video{background:#000}
.splash__fallback{position:absolute;top:0;right:0;bottom:0;left:0;display:none;background:#000}
.splash__fallback::before{content:"";position:absolute;top:0;right:0;bottom:0;left:0;background:url("/assets/v3/img/bg-750.webp") 50% 50%/cover no-repeat;filter:saturate(.5) brightness(.3)}
.splash.is-fallback .splash__fallback{display:block}
.splash.is-fallback .splash__video{display:none}
.splash__text{opacity:0;transition:opacity .9s cubic-bezier(.22,.61,.36,1)}
.splash__text.is-in{opacity:1}
html.splash-out .splash{animation:sp-out var(--sp-out,1200ms) cubic-bezier(.22,.61,.36,1) both}
@keyframes sp-out{from{opacity:1;transform:scale(1)}to{opacity:0;transform:scale(1.02)}}
@keyframes sp-fade{from{opacity:1}to{opacity:0}}
@media (prefers-reduced-motion:reduce){
.splash__text{transition:none}
html.splash-out .splash{animation:sp-fade var(--sp-out,600ms) ease both}
html.splash-out body>:not(.splash){transition-timing-function:ease}
}
</style>

<script>
(function(){
var d=document.documentElement,api={active:false,ready:function(){},start:function(){}};window.WITH_SPLASH=api;
window.addEventListener("load",function(){setTimeout(function(){d.classList.add("is-ready")},1500)});
var show=true;try{if(sessionStorage.getItem("with.v3.splash"))show=false;else sessionStorage.setItem("with.v3.splash","1")}catch(e){show=true}
if(!show)return;
api.active=true;d.classList.add("splash-on");
var pl=document.createElement("link");pl.rel="preload";pl.as="image";pl.href="/assets/v3/img/welcome-text-720.webp";pl.setAttribute("fetchpriority","high");document.head.appendChild(pl);
var reduce=!!(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches),isReady=false,doneAt=Infinity,gone=false,mode="";
function now(){return performance.now()}
function leave(ms){if(gone)return;gone=true;d.style.setProperty("--sp-out",ms+"ms");d.classList.add("splash-out");
var s=document.getElementById("splash"),v=s&&s.querySelector("video");
setTimeout(function(){if(v){try{v.pause()}catch(e){}}if(s&&s.parentNode)s.parentNode.removeChild(s);d.classList.remove("splash-on","splash-out");d.style.removeProperty("--sp-out")},ms+80)}
function settle(){if(isReady&&now()>=doneAt)leave(reduce?600:1200)}
api.ready=function(){isReady=true;settle()};
setTimeout(function(){leave(reduce?600:1200)},Math.max(2500,8000-now()));
function skip(){if(!gone)leave(600)}
document.addEventListener("pointerdown",function(e){if(e.target&&e.target.closest&&e.target.closest(".splash"))skip()},true);
document.addEventListener("keydown",skip,true);
api.start=function(){
var s=document.getElementById("splash");if(!s)return;
var v=s.querySelector("video"),img=s.querySelector(".splash__text");
img.onload=function(){if(mode==="fallback")img.classList.add("is-in")};img.src=img.getAttribute("data-src");
function fallback(hold){if(mode==="fallback")return;mode="fallback";
if(v){try{v.pause()}catch(e){}v.removeAttribute("src");try{v.load()}catch(e){}}
s.classList.add("is-fallback");
if(img.complete&&img.naturalWidth)img.classList.add("is-in");
doneAt=now()+hold;setTimeout(settle,hold+20)}
if(reduce||!v||!v.play){fallback(reduce?1500:3300);return}
v.muted=true;v.defaultMuted=true;v.playsInline=true;v.poster=v.getAttribute("data-poster");v.src=v.getAttribute("data-src");
v.addEventListener("playing",function(){if(!mode)mode="video"});
v.addEventListener("ended",function(){if(mode==="video"){doneAt=now();settle()}});
v.addEventListener("error",function(){if(mode!=="video")fallback(3300)});
var p;try{p=v.play()}catch(e){fallback(3300)}
if(p&&p.catch)p.catch(function(){if(mode!=="video")fallback(3300)});
setTimeout(function(){if(!mode)fallback(3300)},1000);
};
})();
</script>
