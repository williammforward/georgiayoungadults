<body data-page="map">

<div class="bg" aria-hidden="true">
  <div class="bg__drift">
    <picture>
      <source media="(max-width: 700px)" type="image/webp" srcset="/assets/v2/img/bg-750.webp 750w, /assets/v2/img/bg-900.webp 900w" sizes="100vw">

    </picture>
    <picture>
      <source media="(max-width: 700px)" type="image/webp" srcset="/assets/v2/img/bg-750.webp 750w, /assets/v2/img/bg-900.webp 900w" sizes="100vw">
      <source type="image/webp" srcset="/assets/v2/img/bg-1080.webp">
      <img class="bg__art" id="bg-photo" src="/assets/v2/img/bg-fallback.jpg" alt="" decoding="async">
    </picture>
  </div>
  <div class="bg__shade"></div>
</div>

<main class="page">

    <h1 class="t-page">Map</h1>
    <div class="page-head__pills" id="head-pills"></div>
  </header>

  <section class="map" aria-label="Venue map">
    <div class="map__view" id="map-view">
      <div class="map__canvas" id="map-canvas"></div>
      <div class="map__zoom">
        <button class="map__btn" id="zoom-in" type="button" aria-label="Zoom in">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        </button>
        <button class="map__btn" id="zoom-out" type="button" aria-label="Zoom out" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"/></svg>
        </button>
      </div>
    </div>
    <div class="legend" aria-label="Map legend">
      <span class="pill"><span class="legend__mark"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2.6l2.9 6 6.5.9-4.7 4.6 1.1 6.5L12 17.5l-5.8 3.1 1.1-6.5L2.6 9.5l6.5-.9z"/></svg></span>Entrance</span>
      <span class="pill"><span class="legend__mark">R</span>Restrooms</span>
      <span class="pill"><span class="legend__mark">E</span>Elevator</span>
    </div>
  </section>

  <div class="chips" id="chips" role="group" aria-label="Rooms"></div>
  <div id="room-card"></div>
</main>
